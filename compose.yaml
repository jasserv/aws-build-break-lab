services:
  lab-tools:
    image: build-break-tools:1.0
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_ENDPOINT_URL: "http://awsfloci-floci-1:4566"
      TF_VAR_floci_endpoint: "http://awsfloci-floci-1:4566"
      AWS_SHARED_CREDENTIALS_FILE: /workspace/.lab-aws/credentials
    networks:
      - floci
    stdin_open: true
    tty: true

networks:
  floci:
    external: true
    name: awsfloci_default
